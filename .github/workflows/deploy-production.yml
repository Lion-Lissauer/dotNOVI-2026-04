name: Deploy to Production

on:
  repository_dispatch:
    types: [deploy-production]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full Docker image reference to deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify image exists
        run: |
          echo "Pulling image: ${{ github.event.client_payload.image_ref || inputs.image_ref }}"
          docker pull ${{ github.event.client_payload.image_ref || inputs.image_ref }}

      - name: Create network
        run: docker network create appnet || true

      - name: Start Postgres
        run: |
          docker run -d \
            --name postgres \
            --network appnet \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dotnovi \
            postgres:16

      - name: Start container
        env:
          IMAGE_REF: ${{ github.event.client_payload.image_ref || inputs.image_ref }}
          NODE_ENV: production
        run: |
          echo "Starting container with image: $IMAGE_REF"
          docker run -d \
            --network appnet \
            -e DATABASE_URL="postgres://postgres:postgres@postgres:5432/dotnovi" \
            -e NODE_ENV="$NODE_ENV" \
            -p 3000:3000 \
            $IMAGE_REF

      - name: Show running containers
        run: docker ps -a

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to become ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health/simple || true)
            if [ "$STATUS" = "200" ]; then
              echo "Service is ready!"
              break
            fi
            echo "Service not ready yet (status: $STATUS). Retrying..."
            sleep 3
          done

      - name: Debug container env
        run: |
          curl -f http://localhost:3000/debug/env

      - name: Run smoke tests
        run: |
          sleep 5
          curl -f http://localhost:3000/health/simple || exit 1
          curl -f http://localhost:3000/api/notes || exit 1

      - name: Show container logs (including exited)
        run: |
          docker ps -a -q | xargs -I {} docker logs {}    

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get previous image ref
        id: previous
        run: |
          echo "image_ref=ghcr.io/lion-lissauer/dotnovi-2026-04:previous" >> $GITHUB_OUTPUT

      - name: Rollback to previous version
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image_ref }}
        run: |
          echo "Rolling back to: $PREVIOUS_IMAGE"