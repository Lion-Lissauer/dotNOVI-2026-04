name: Deploy to Production

on:
  repository_dispatch:
    types: [deploy-production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify image exists
        run: |
          docker pull ${{ github.event.client_payload.image_tag || inputs.image_tag }}
      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag }}
          DEPLOYMENT_ENV: production
        run: |

      - name: Debug DATABASE_URL
        run: |
          echo "DATABASE_URL is: $DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Start container
        env:
          IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          docker run -d -p 3000:3000 -e DATABASE_URL="$DATABASE_URL" ghcr.io/lion-lissauer/dotnovi-2026-04:$IMAGE_TAG

      - name: Show container logs
        run: |
          echo "Container logs:"
          docker logs $(docker ps -q)

      - name: Show running containers
        run: docker ps -a

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to become ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Service is ready!"
              break
            fi
            echo "Service not ready yet (status: $STATUS). Retrying..."
            sleep 3
          done

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 10
          # Check health endpoint
          curl -f http://localhost:3000/health || exit 1
          # Check API endpoint
          curl -f http://localhost:3000/api/notes || exit 1
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get previous image tag
        id: previous
        run: |
          # Get the previous deployment's image tag
          # This would normally come from your deployment tracking system
          echo "image_tag=dotnovi:previous" >> $GITHUB_OUTPUT
      - name: Rollback to previous version
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image_tag }}
        run: |
          echo "Rolling back to: $PREVIOUS_IMAGE"
          # kubectl rollout undo deployment/dotnovi