name: Deploy to Production

on:
  repository_dispatch:
    types: [deploy-production]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full Docker image reference to deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set IMAGE_REF
        run: echo "IMAGE_REF=${{ github.event.client_payload.image_ref || inputs.image_ref }}" >> $GITHUB_ENV

      - name: Verify image exists
        run: |
          echo "Pulling image: $IMAGE_REF"
          docker pull $IMAGE_REF

      - name: Debug DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          echo "DATABASE_URL is: $DATABASE_URL"

      - name: Start container
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          docker run -d \
            -e NODE_ENV=production \
            -e DATABASE_URL=$DATABASE_URL \
            -p 3000:3000 \
            $IMAGE_REF

      - name: Show container logs (including exited)
        run: docker logs $(docker ps -a -q)

      - name: Show running containers
        run: docker ps -a

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to become ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health/simple || true)
            if [ "$STATUS" = "200" ]; then
              echo "Service is ready!"
              break
            fi
            echo "Service not ready yet (status: $STATUS). Retrying..."
            sleep 3
          done

      - name: Debug container env
        run: curl -f http://localhost:3000/debug/env

      - name: Run smoke tests
        run: |
          sleep 5
          curl -f http://localhost:3000/health/simple || exit 1
          curl -f http://localhost:3000/api/notes || exit 1
